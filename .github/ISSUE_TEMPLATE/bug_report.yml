name: Bug report
description: Something in the tooling or the marketplace is broken
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. run `node scripts/validate.mjs`
        2. see error ...
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Node version and OS
      placeholder: "node v20.11.0 on macOS 14"
    validations:
      required: true